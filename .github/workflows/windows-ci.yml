name: Windows CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 15
    strategy:
      matrix:
        python-version: ['3.10', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install and check runtime dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip check
          python -c "import PrivacyGuardV4"
      - name: Build Windows executable
        run: |
          python -m pip install -r requirements-build.txt
          python -m PyInstaller --noconfirm --onefile --windowed --collect-all customtkinter --name PrivacyGuardV4 PrivacyGuardV4.py
          if (-not (Test-Path -PathType Leaf dist/PrivacyGuardV4.exe)) { throw "Windows executable was not created" }
